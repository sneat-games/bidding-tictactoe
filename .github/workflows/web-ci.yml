# CI for the web/ workspace.
#
# The repo previously had Go CI only, so nothing ever ran `npm ci` for the
# web app: two devDependency pins drifted into a state where BOTH `npm ci`
# and `npm install` failed outright on main, and no build, lint or test had
# run against the web workspace for as long as that was true.
#
# `npm ci` is deliberately first and unforgiving (no --legacy-peer-deps): a
# lockfile that cannot be installed from a clean checkout is the failure this
# job exists to catch.
#
# A dedicated e2e job (mirrors hex/dots-and-boxes/reversi's web-ci.yml)
# keeps a typecheck/lint/test/build failure reporting fast without waiting
# on a Playwright browser download and the full e2e suite; it depends on
# the `web` job so a broken build never gets to the slower job at all.

name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 5
